version: 2

updates:
  - package-ecosystem: npm
    directory: /

    schedule:
      interval: weekly
      day: monday
      time: '19:00'
      timezone: 'Europe/Tallinn'

    cooldown:
      default-days: 1

    ignore:
      - dependency-name: typescript
        update-types:
          - version-update:semver-major

    groups:
      all-updates:
        applies-to: version-updates

        patterns:
          - '*'
